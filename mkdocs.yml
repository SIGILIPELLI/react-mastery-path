site_name: React Mastery Path
site_description: A structured, module-wise React training program — hooks-first, from your first component to large-app architecture.
site_url: https://sigilipelli.github.io/react-mastery-path/
repo_url: https://github.com/sigilipelli/react-mastery-path
repo_name: react-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup with Vite & Your First Component": level-1/01-setup-vite.md
      - "02 · JSX in Depth": level-1/02-jsx.md
      - "03 · Components & Props": level-1/03-components-props.md
      - "04 · State with useState": level-1/04-state-usestate.md
      - "05 · Handling Events": level-1/05-events.md
      - "06 · Conditional Rendering, Lists & Keys": level-1/06-conditional-lists-keys.md
      - "07 · Forms & Controlled Inputs": level-1/07-forms-controlled-inputs.md
      - "08 · useEffect Basics": level-1/08-useeffect-basics.md
      - "09 · Styling React Apps": level-1/09-styling.md
      - "10 · Project — Expense Tracker": level-1/10-project-expense-tracker.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Composition & children": level-2/01-composition-children.md
